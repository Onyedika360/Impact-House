<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accept Invitation — Impact House</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script>
    window.CLERK_KEY = window.location.hostname === 'localhost'
      ? 'pk_test_aW50ZWdyYWwtZmlsbHktOTQuY2xlcmsuYWNjb3VudHMuZGV2JA'
      : 'pk_live_Y2xlcmsuYXBwLnRrcGltcGFjdGhvdXNlLm9yZyQ';
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #131210; --charcoal: #1e1d1b; --muted: #7a7874;
      --border: #e2ddd6; --surface: #f9f7f4; --white: #fff;
      --gold: #c9a96e; --gold-light: #f0e6d0; --gold-dark: #9e7c46;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'DM Sans', sans-serif;
      --radius: 10px; --danger: #8b2222;
    }
    body {
      font-family: var(--font-body); background: var(--surface);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 32px 16px 64px; color: var(--charcoal);
    }
    header { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 28px; }
    header img { height: 56px; }
    header h1 { font-family: var(--font-display); font-size: 26px; font-weight: 600; color: var(--black); }
    #clerk-mount { width: 100%; max-width: 420px; }
    #loading { font-size: 14px; color: var(--muted); margin-top: 12px; }
    .error-card {
      display: none; background: var(--white); border: 1px solid var(--border);
      border-radius: 14px; padding: 40px 28px; width: 100%; max-width: 420px; text-align: center;
    }
    .error-card.visible { display: block; }
    .error-card .icon { font-size: 48px; margin-bottom: 16px; }
    .error-card h2 { font-family: var(--font-display); font-size: 22px; margin-bottom: 10px; }
    .error-card p { font-size: 14px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Impact House">
    <h1>Impact House</h1>
  </header>

  <p id="loading">Loading…</p>
  <div id="clerk-mount"></div>

  <div class="error-card" id="error-card">
    <div class="icon">⚠️</div>
    <h2>Invalid Invitation</h2>
    <p>This invitation link is invalid or has expired. Ask an admin to send a new one.</p>
  </div>

  <script>
    if (window.location.hash.startsWith('#/')) {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    const hasTicket = new URLSearchParams(window.location.search).has('__clerk_ticket');

    if (!hasTicket) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-card').classList.add('visible');
    } else {
      const src = window.location.hostname === 'localhost'
        ? 'https://integrated-filly-94.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js'
        : 'https://clerk.app.tkpimpacthouse.org/npm/@clerk/clerk-js@latest/dist/clerk.browser.js';

      const s = document.createElement('script');
      s.src = src;
      s.setAttribute('data-clerk-publishable-key', window.CLERK_KEY);
      s.crossOrigin = 'anonymous';
      s.onload = async () => {
        try {
          await window.Clerk.load();
          document.getElementById('loading').style.display = 'none';
          window.Clerk.mountSignUp(document.getElementById('clerk-mount'), {
            afterSignUpUrl: window.location.origin + '/',
            afterSignInUrl: window.location.origin + '/',
          });
        } catch (e) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('error-card').classList.add('visible');
        }
      };
      s.onerror = () => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-card').classList.add('visible');
      };
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
